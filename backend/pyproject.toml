[project]
name = "gae"
version = "0.1.0"
description = "Go All-Electric backend: heat pump second-opinion maths and API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "google-genai>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.20",
    "pillow>=11.0.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not atlas_local'"
markers = ["atlas_local: opt-in Atlas Local Search/Vector Search integration (requires ATLAS_LOCAL_URI)"]
